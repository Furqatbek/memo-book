name: Deploy to GitHub Pages

# Publishes the site by force-pushing index.html, assets/ and ru/ to the
# gh-pages branch, which GitHub Pages serves. (The actions/deploy-pages route
# needs the Pages site pre-created in repo Settings; this route does not.)

on:
  push:
    branches:
      - main
      - claude/memo-book-project-duulu7
    paths:
      - "index.html"
      - "ru/**"
      - "uz/**"
      - "uz-cyrl/**"
      - "kaa/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site to gh-pages
        run: |
          set -eu
          SITE=$(mktemp -d)
          cp -r index.html assets ru uz uz-cyrl kaa "$SITE"/
          touch "$SITE"/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$SITE"/. .
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA}"
          git push origin +gh-pages-tmp:gh-pages
