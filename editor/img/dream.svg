<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" fill="none"
     role="presentation" aria-hidden="true">
  <!--
    The horizon along the bottom of the screens outside the editor (A84): an
    open book on a hillside, lit from inside, its pages lifting away as
    photographs into a night sky. Books, photos and sweet dreams, which is
    the brief.

    Drawn rather than photographed so it costs 6 KB, scales to any width and
    needs no third-party request. Two constraints shape it:

      - it sits BEHIND a white sheet of content, so everything is line work
        at low opacity — ambience at the edges, not a picture competing for
        the middle;
      - the book is deliberately off-centre, in the left third. Centred, it
        landed squarely behind the middle of the perk row on every viewport
        width, and no amount of translucency makes a 2px ink line stop
        reading through a sentence. The empty middle is the point.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2456d6" stop-opacity="0"/>
      <stop offset=".55" stop-color="#2456d6" stop-opacity=".05"/>
      <stop offset="1" stop-color="#1a3f9c" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93aae4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#93aae4" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b88d4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#6b88d4" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6bd6c"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <!-- the light coming out of the open book -->
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f3d9a2" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#eccf95" stop-opacity=".18"/>
      <stop offset="1" stop-color="#eccf95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdf6e8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#2456d6" opacity=".26">
    <circle cx="72" cy="118" r="1.7"/><circle cx="146" cy="52" r="2.2"/>
    <circle cx="214" cy="168" r="1.4"/><circle cx="288" cy="88" r="1.8"/>
    <circle cx="368" cy="30" r="1.5"/><circle cx="424" cy="136" r="2"/>
    <circle cx="556" cy="46" r="1.5"/><circle cx="668" cy="118" r="1.6"/>
    <circle cx="792" cy="34" r="1.7"/><circle cx="912" cy="150" r="1.5"/>
    <circle cx="1024" cy="62" r="2"/><circle cx="1136" cy="164" r="1.5"/>
    <circle cx="1218" cy="118" r="1.6"/><circle cx="1302" cy="46" r="2.1"/>
    <circle cx="1372" cy="140" r="1.5"/><circle cx="1408" cy="76" r="1.7"/>
  </g>
  <!-- four-point sparkles: the one warm note up in the sky -->
  <g stroke="url(#gold)" stroke-width="1.7" stroke-linecap="round" opacity=".6">
    <path d="M182 96v18M172 105h20"/>
    <path d="M486 52v14M479 59h14"/>
    <path d="M1088 92v17M1079.5 100.5h17"/>
    <path d="M1338 158v13M1331.5 164.5h13"/>
  </g>

  <!-- crescent moon, on the far side from the book -->
  <g opacity=".55" transform="translate(1222 54)">
    <path d="M30 0a30 30 0 1 0 17 54A34 34 0 0 1 30 0Z" fill="url(#gold)"/>
  </g>

  <!-- rolling ground -->
  <path d="M0 356c164-44 282 14 438 8 156-6 254-62 424-56 170 5 266 66 420 60 62-2 116-14 158-24v176H0Z"
        fill="url(#hillFar)"/>
  <path d="M0 424c192-36 312 16 470 14 158-2 268-48 432-42 164 5 272 52 432 44 40-2 78-8 106-13v93H0Z"
        fill="url(#hillNear)"/>

  <!-- the light the book gives off, under everything it lights -->
  <ellipse cx="330" cy="352" rx="300" ry="200" fill="url(#glow)"/>

  <!-- photographs lifting off the pages and climbing away to the right,
       smaller and fainter with every step -->
  <g stroke="#2456d6" fill="#fff">
    <g opacity=".30" transform="translate(462 236) rotate(12)">
      <rect x="0" y="0" width="74" height="88" rx="5" stroke-width="2"/>
      <rect x="7" y="7" width="60" height="56" rx="2" stroke-width="1.3" fill="#e9effc"/>
      <path d="M9 58l16-17 12 12 11-14 19 21H9Z" fill="#c4d4f5" stroke="none"/>
      <circle cx="52" cy="21" r="6" fill="#f2d9a6" stroke="none"/>
    </g>
    <g opacity=".24" transform="translate(596 172) rotate(-9)">
      <rect x="0" y="0" width="64" height="76" rx="5" stroke-width="1.9"/>
      <rect x="6" y="6" width="52" height="48" rx="2" stroke-width="1.3" fill="#e9effc"/>
      <path d="M8 50l13-14 10 10 10-12 17 16H8Z" fill="#c4d4f5" stroke="none"/>
    </g>
    <g opacity=".18" transform="translate(730 118) rotate(14)">
      <rect x="0" y="0" width="54" height="64" rx="4" stroke-width="1.8"/>
      <rect x="5" y="5" width="44" height="41" rx="2" stroke-width="1.2" fill="#e9effc"/>
      <circle cx="37" cy="17" r="5" fill="#f2d9a6" stroke="none"/>
    </g>
    <g opacity=".13" transform="translate(872 76) rotate(-6)">
      <rect x="0" y="0" width="46" height="54" rx="4" stroke-width="1.7"/>
      <rect x="4" y="4" width="38" height="34" rx="2" stroke-width="1.2" fill="#e9effc"/>
    </g>
    <g opacity=".09" transform="translate(1002 44) rotate(11)">
      <rect x="0" y="0" width="38" height="46" rx="4" stroke-width="1.6"/>
      <rect x="4" y="4" width="30" height="28" rx="2" stroke-width="1.1" fill="#e9effc"/>
    </g>
  </g>
  <!-- the path they travel -->
  <path d="M440 306c72-46 126-72 186-104 74-40 156-76 246-104 64-20 118-36 164-46"
        stroke="#2456d6" stroke-width="1.6" stroke-dasharray="5 10"
        stroke-linecap="round" opacity=".24" fill="none"/>

  <!-- the open book on the hillside, in the left third -->
  <g stroke="#2456d6" stroke-linejoin="round">
    <!-- the leaves behind, so it has thickness -->
    <path d="M330 328c-28-16-62-20-92-15v100c30-5 64-1 92 15 28-16 62-20 92-15V313c-30-5-64-1-92 15Z"
          fill="#e8eefc" opacity=".5" stroke="none"/>
    <path d="M330 318C300 304 266 298 234 302V406C266 402 300 408 330 422
             C360 408 394 402 426 406V302C394 298 360 304 330 318Z"
          fill="url(#page)" opacity=".92" stroke-width="2.2"/>
    <path d="M330 318V422" stroke-width="2.2" opacity=".9"/>
    <g stroke-width="1.3" opacity=".32" fill="none">
      <path d="M256 330c18-3 38-1 54 6M256 352c18-3 38-1 54 6M256 374c18-3 38-1 54 6"/>
      <path d="M404 330c-18-3-38-1-54 6M404 352c-18-3-38-1-54 6M404 374c-18-3-38-1-54 6"/>
    </g>
  </g>
</svg>
