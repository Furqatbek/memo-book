<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RS Pixel — Book editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='3' fill='%232456d6'/%3E%3Crect x='9' y='9' width='14' height='9' rx='1.5' fill='white' opacity='.92'/%3E%3Crect x='9' y='21' width='10' height='2.5' rx='1.25' fill='white' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="editor.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="toasts" aria-live="polite"></div>

  <!-- ============ START ============ -->
  <section id="screen-start" class="screen">
    <header class="bar">
      <a class="brand" href="../" title="RS Pixel — home">RS Pixel</a>
      <a class="btn small home-link" href="../"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5.5 10.5V20h13v-9.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span data-i18n="nav.home"></span></a>
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
    </header>
    <div class="start-body">
      <div id="api-offline" class="notice warn hidden">
        <b data-i18n="start.offline"></b>
        <span data-i18n="start.offlineHint"></span>
      </div>

      <div id="resume-card" class="card resume hidden">
        <div>
          <b data-i18n="start.resumeTitle"></b>
          <span id="resume-info"></span>
        </div>
        <div class="row">
          <button id="btn-resume" class="btn primary" data-i18n="start.resumeBtn"></button>
          <button id="btn-new" class="btn" data-i18n="start.newBtn"></button>
        </div>
      </div>

      <div id="start-new">
        <h1 data-i18n="start.title"></h1>
        <div id="type-step">
          <p class="step-label" data-i18n="start.typeTitle"></p>
          <div class="type-grid" id="type-grid">
            <button class="btype" data-btype="love"><span class="bt-ico">❤️</span><span data-i18n="type.love"></span></button>
            <button class="btype" data-btype="travel"><span class="bt-ico">✈️</span><span data-i18n="type.travel"></span></button>
            <button class="btype" data-btype="birthday"><span class="bt-ico">🎂</span><span data-i18n="type.birthday"></span></button>
            <button class="btype" data-btype="memory"><span class="bt-ico">📸</span><span data-i18n="type.memory"></span></button>
          </div>
        </div>
        <div id="tier-step" class="hidden">
        <p class="step-label"><b id="type-chosen"></b> · <a href="#" id="type-change" data-i18n="start.changeType"></a></p>
        <p class="muted" data-i18n="start.subtitle"></p>
        <div class="tier-grid" id="tier-grid">
          <button class="tier" data-tier="16"><b>16</b><span data-i18n="start.pages"></span><span class="tier-price" data-tier-price="16"></span></button>
          <button class="tier" data-tier="32"><b>32</b><span data-i18n="start.pages"></span><span class="tier-price" data-tier-price="32"></span></button>
          <button class="tier" data-tier="48"><b>48</b><span data-i18n="start.pages"></span><span class="tier-price" data-tier-price="48"></span></button>
          <button class="tier" data-tier="96"><b>96</b><span data-i18n="start.pages"></span><span class="tier-price" data-tier-price="96"></span></button>
        </div>
        </div>
      </div>
      <p class="start-track"><a href="#" id="track-link" data-i18n="order.lookupTitle"></a></p>
    </div>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="screen-editor" class="screen">
    <header class="bar ed-bar">
      <button id="ed-back" class="icon-btn" aria-label="Back">←</button>
      <a class="brand ed-brand" href="../" title="RS Pixel — home">RS Pixel</a>
      <a class="icon-btn home-link" href="../" data-i18n-title="nav.home"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5.5 10.5V20h13v-9.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></a>
      <span id="save-state" class="save-state"></span>
      <span class="spacer"></span>
      <select id="tier-select" aria-label="Pages">
        <option value="16">16</option><option value="32">32</option>
        <option value="48">48</option><option value="96">96</option>
      </select>
      <button id="btn-autofill" class="btn" data-i18n="tool.autofill"></button>
      <button id="btn-preview" class="btn primary" data-i18n="tool.preview"></button>
    </header>
    <div id="elig-banner" class="notice warn slim hidden"></div>
    <div id="locked-banner" class="notice warn slim hidden">
      <span data-i18n="lock.banner"></span>
      <button id="btn-view-order" class="btn small" data-i18n="lock.viewOrder"></button>
    </div>
    <main class="ed-main">
      <aside class="tray" id="tray">
        <label class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" multiple
                 accept=".jpg,.jpeg,.png,.heic,.heif,image/jpeg,image/png,image/heic,image/heif">
          <b data-i18n="tray.add"></b>
          <span class="muted" data-i18n="tray.drop"></span>
        </label>
        <div class="tray-row">
          <div id="tray-count" class="tray-count"></div>
          <div class="tray-actions">
            <button id="btn-select-mode" class="btn small hidden"
                    data-i18n="tray.select"></button>
            <button id="btn-delete-sel" class="btn small danger hidden"></button>
            <button id="btn-delete-all" class="btn small danger hidden"
                    data-i18n="tray.deleteAll"></button>
          </div>
        </div>
        <div id="tray-grid" class="tray-grid"></div>
        <p class="muted tray-hint" data-i18n="tray.hint"></p>
      </aside>
      <section class="stage">
        <div class="stage-toolbar">
          <span id="page-label" class="page-label"></span>
          <button id="btn-add-text" class="btn small" data-i18n="tool.addText"></button>
          <div id="page-tools" class="page-tools"></div>
          <div id="sel-toolbar" class="sel-toolbar hidden"></div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <div id="page-canvas" class="page-canvas"></div>
        </div>
        <nav id="filmstrip" class="filmstrip" aria-label="Pages"></nav>
      </section>
    </main>
  </section>

  <!-- ============ PREVIEW ============ -->
  <section id="screen-preview" class="screen">
    <header class="bar">
      <button id="pv-back" class="icon-btn" aria-label="Back">←</button>
      <b data-i18n="preview.title"></b>
    </header>
    <div class="pv-body">
      <div id="pv-status" class="pv-status"></div>
      <div id="pv-stale" class="notice warn hidden">
        <span data-i18n="preview.stale"></span>
        <button id="pv-rerender" class="btn small" data-i18n="preview.rerender"></button>
      </div>
      <div id="pv-grid" class="pv-grid"></div>
    </div>
    <footer class="pv-footer">
      <label class="check">
        <input type="checkbox" id="pv-confirm">
        <span data-i18n="preview.confirm"></span>
      </label>
      <b id="pv-price" class="pv-price"></b>
      <button id="pv-checkout" class="btn primary" disabled data-i18n="preview.checkout"></button>
    </footer>
  </section>

  <!-- ============ CHECKOUT ============ -->
  <section id="screen-checkout" class="screen">
    <header class="bar">
      <button id="co-back" class="icon-btn" aria-label="Back">←</button>
      <b data-i18n="co.title"></b>
    </header>
    <form id="co-form" class="co-form">
      <label><span data-i18n="co.name"></span>
        <input name="name" required maxlength="200" autocomplete="name"></label>
      <label><span data-i18n="co.phone"></span>
        <input name="phone" required inputmode="tel" placeholder="+998 90 123 45 67"
               autocomplete="tel"></label>
      <label><span data-i18n="co.address"></span>
        <textarea name="address" required maxlength="500" rows="3"
                  autocomplete="street-address"></textarea></label>
      <label><span data-i18n="co.email"></span>
        <input name="email" type="email" maxlength="200" autocomplete="email"></label>
      <p class="pay-hint" data-i18n="co.payHint"></p>
      <p class="muted" data-i18n="co.note"></p>
      <button type="submit" class="btn primary" data-i18n="co.submit"></button>
    </form>
  </section>

  <!-- ============ ORDER ============ -->
  <section id="screen-order" class="screen">
    <header class="bar">
      <a class="brand" href="../" title="RS Pixel — home">RS Pixel</a>
      <a class="btn small home-link" href="../"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5.5 10.5V20h13v-9.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span data-i18n="nav.home"></span></a>
      <span class="spacer"></span>
      <button id="or-new-book" class="btn small" data-i18n="order.newBook"></button>
    </header>
    <div class="or-body">
      <form id="or-lookup" class="co-form hidden">
        <b data-i18n="order.lookupTitle"></b>
        <label><span data-i18n="order.ref"></span>
          <input name="ref" required placeholder="UB-XXXXX" autocapitalize="characters"></label>
        <label><span data-i18n="co.phone"></span>
          <input name="phone" required inputmode="tel" placeholder="+998 90 123 45 67"></label>
        <button type="submit" class="btn primary" data-i18n="order.lookupBtn"></button>
      </form>
      <div id="or-details" class="hidden">
        <h1 data-i18n="order.title"></h1>
        <div class="or-ref-card card">
          <div><span class="muted" data-i18n="order.ref"></span> <b id="or-ref"></b></div>
          <div><span class="muted" data-i18n="order.amount"></span> <b id="or-amount"></b></div>
        </div>
        <ol id="or-timeline" class="timeline"></ol>
        <div id="or-files" class="card or-files hidden">
          <b data-i18n="order.files"></b>
          <div class="or-file-links">
            <a id="or-file-interior" class="btn" target="_blank" rel="noopener"
               data-i18n="order.fileInterior"></a>
            <a id="or-file-cover" class="btn" target="_blank" rel="noopener"
               data-i18n="order.fileCover"></a>
          </div>
        </div>
        <div id="or-paycard" class="pay-wrap hidden">
          <b data-i18n="order.payTitle"></b>
          <div class="bank-card">
            <div class="bank-top"><span class="bank-chip"></span><span class="bank-brand">RS Pixel</span></div>
            <div id="pay-number" class="bank-number"></div>
            <div class="bank-holder" id="pay-holder"></div>
          </div>
          <button id="pay-copy" class="btn small" type="button" data-i18n="order.copyCard"></button>
          <p class="pay-note" data-i18n="order.payCardNote"></p>
          <p class="pay-note"><b data-i18n="order.callNote"></b></p>
        </div>
        <p class="muted" id="or-pay-note" data-i18n="order.payNote"></p>
        <div id="or-dev" class="card dev hidden">
          <span class="muted" data-i18n="order.devHint"></span>
          <button id="or-dev-pay" class="btn" data-i18n="order.devPay"></button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
