<!-- Source for assets/og.png, the 1200x630 card that Telegram, Instagram and
     every other link preview renders (P1-4).

     THIS IS AN ILLUSTRATION, NOT A PHOTOGRAPH, and deliberately looks like
     one. The brief asked for a photo of a real book; no book has been
     printed yet — that is still an open item on the launch checklist. A
     rendered mock-up passed off as a product photograph would be the
     reviews problem in picture form, so this draws the product as a
     drawing: our own artwork, our own wordmark, nothing pretending to be a
     thing we have not made.

     REPLACE IT with a photograph of a real printed book the day one exists.
     One file, one line in each of five pages.

     No translatable text on the card: og:title and og:description carry the
     language, and five rendered images would be five things to keep in step.

     Re-render:  node browser-tests/tools/render-og.js
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3fa0"/>
      <stop offset="1" stop-color="#2456d6"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c8a5a"/><stop offset="1" stop-color="#e8b93c"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ef6a4d"/><stop offset="1" stop-color="#f6c46a"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb8ff"/><stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1f52" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- faint page-corner geometry, the same motif the site uses -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2">
    <path d="M-40 520 L240 240 L520 520"/>
    <path d="M700 640 L980 360 L1260 640"/>
    <circle cx="1060" cy="120" r="150"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(96 96)">
    <rect width="56" height="56" rx="13" fill="#ffffff"/>
    <path d="M14 16h12v24H14z" fill="#2456d6"/>
    <path d="M30 16h12v24H30z" fill="#8fb8ff"/>
    <text x="76" y="41" font-family="Georgia, 'Times New Roman', serif"
          font-size="40" fill="#ffffff">RS Pixel</text>
  </g>

  <!-- an open lay-flat book, drawn as a drawing -->
  <g transform="translate(96 214)" filter="url(#soft)">
    <rect x="0" y="0" width="1008" height="322" rx="10" fill="#ffffff"/>
    <!-- the fold: the product's one real promise, that it opens flat -->
    <rect x="502" y="10" width="4" height="302" fill="#0b1f52" fill-opacity=".10"/>
    <!-- left page: one photo across most of it -->
    <rect x="34" y="34" width="434" height="196" rx="6" fill="url(#p1)"/>
    <rect x="34" y="248" width="250" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="34" y="274" width="178" height="12" rx="6" fill="#eef1f6"/>
    <!-- right page: a small grid -->
    <rect x="540" y="34" width="208" height="130" rx="6" fill="url(#p2)"/>
    <rect x="766" y="34" width="208" height="130" rx="6" fill="url(#p3)"/>
    <rect x="540" y="180" width="434" height="82" rx="6" fill="#dbe4ff"/>
    <rect x="540" y="278" width="220" height="12" rx="6" fill="#e5e7eb"/>
  </g>

  <text x="96" y="592" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="26" fill="#ffffff" fill-opacity=".82">rspixel.uz</text>
</svg>
