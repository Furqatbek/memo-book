[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-book-backend"
version = "0.1.0"
description = "Backend for the self-serve photo book platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "structlog>=24.1",
]
# Milestone-gated dependencies (add when their milestone starts, per spec Part 10):
#   M4 photo ingest : pillow, pillow-heif, rq
#   M6 render       : reportlab
#   M9 payments     : (none new — httpx already present)

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
