[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-book-backend"
version = "0.1.0"
description = "Backend for the self-serve photo book platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "structlog>=24.1",
    "email-validator>=2.1",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "rq>=1.16",
    "anyio>=4.0",
    "reportlab>=4.1",
    "python-multipart>=0.0.9",  # admin artwork upload (UploadFile)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "aiosqlite>=0.20",
    "moto[s3,server]>=5.0",  # server extra: scripts/devserver.py runs S3 in-process
    "pypdf>=4.2",
    "pymupdf~=1.28.0",  # pinned: the golden-raster test depends on its output
    # [woff] pulls brotli: without it fontTools can list a .ttf but not
    # read the .woff2 files the editor actually ships.
    "fonttools[woff]>=4.50",  # glyph-coverage regression test for shipped fonts
    "pyyaml>=6.0",  # reads deploy/docker-compose.prod.yml in the deploy tests
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned deliberately. `ruff>=0.5` is a floor, not a pin, and ruff's *default*
# rule set widens between releases — a container rebuild once turned a green
# gate into ten findings in code nobody had touched. A lint gate that changes
# meaning on its own is not a gate. This is the set the codebase has always
# been held to; widening it is an edit someone makes on purpose, with the
# resulting fixes in the same commit.
select = ["E4", "E7", "E9", "F"]
